#**********************************************************
# Project: RCD330-Plus Desay Emulator (Chroot)
#**********************************************************
# asound-emu.conf -> ALSA configuration
#

#-----------------------------------------------------------------------------------
# FIFO output
#-----------------------------------------------------------------------------------

pcm.emu_fifo {
	type file
	slave.pcm "null"
	file "/tmp/run/emu/audio.fifo"
	format "raw"
}

#-----------------------------------------------------------------------------------
# Default device
#-----------------------------------------------------------------------------------

pcm.!default {
	type plug
	slave {
		pcm "emu_fifo"
		format S16_LE
		rate 48000
		channels 2
	}
}
